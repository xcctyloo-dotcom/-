name: build-ipa
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen ldid
      - run: xcodegen generate
      - run: xcodebuild -project CarPlayCast.xcodeproj -target CarPlayCast -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO SYMROOT=$PWD/build/sym build
      - run: ldid -S"CarPlayCast.entitlements" build/sym/Release-iphoneos/CarPlayCast.app/CarPlayCast
      - run: mkdir -p build/Payload && cp -R build/sym/Release-iphoneos/CarPlayCast.app build/Payload/ && rm -rf build/Payload/CarPlayCast.app/_CodeSignature && cd build && zip -qry CarPlayCast.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CarPlayCast-ipa
          path: build/CarPlayCast.ipa
